[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys build the same way as production.
# Astro reads the Netlify-provided URL so canonical/absolute links stay correct
# per-context once `site` is configured in astro.config.mjs.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
