[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews and branch deploys build the same way as production.
# Astro reads the Netlify-provided URL so canonical/absolute links stay correct
# per-context once `site` is configured in astro.config.mjs.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Netlify does not recognise the `.webmanifest` extension and was serving the
# manifest as `application/octet-stream`. Every icon on the site gets a correct
# type automatically — only this one file was wrong.
#
# It matters more than a mislabelled file usually would. Chrome decides between
# two very different outcomes when you tap install:
#
#   · a WebAPK — a real app entry, appears in the app drawer/shelf, own window
#   · a bookmark shortcut — home screen only, opens in a Chrome tab, no shelf
#
# A manifest it cannot confidently parse drops it to the shortcut, which is
# exactly the "installed but nothing in the app shelf" symptom.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# -----------------------------------------------------------------------------
# Redirects for routes this rebuild removed. Both were live on
# portageplace.netlify.app, so bookmarks, history and any link the client has
# already shared point at them.
#
# 301 rather than 302: these moves are permanent, and a 301 is what passes link
# equity to the new URL. Netlify matches with and without the trailing slash, so
# one rule per path is enough.
#
# `force` is not set. These paths have no file in `dist/`, so the redirect is
# reached anyway — and leaving it off means that if either page is ever restored,
# the real page wins instead of being shadowed by a redirect nobody remembers.
# -----------------------------------------------------------------------------

# Renamed 2026-08-30 when the client's "Community" label became "Tenants".
[[redirects]]
  from = "/community"
  to = "/tenants"
  status = 301

# The Suites page came out 2026-08-30; its floor plan and Phase 2 sections moved
# to the homepage, so that is where the content actually went.
[[redirects]]
  from = "/spaces"
  to = "/"
  status = 301
