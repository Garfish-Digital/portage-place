# Neighbourhood businesses and goodwill relationships.
#
# The three non-placeholder entries come from the supplied research and are real
# organisations on or beside the Portage corridor — but their blurbs are ours and
# none has been asked for permission or a logo yet. Confirm before publishing.
#
# ⚠️ Partner marks: see BUILD_PLAN. The City of South Bend asset we hold is the
# official municipal SEAL, which commonly carries usage restrictions and implies
# endorsement rather than partnership. Request the standard logo instead, and get
# written permission plus vector source for every mark.

