# Floor-plan regions for "Find Your Space".
#
# ⚠️ EVERY ENTRY IS A PLACEHOLDER until the real floor plans arrive. Sizes here
# are shaped to the known ranges (200–2,000 sq ft, four office sizes, Phase 1 is
# ~20,000 of the building's ~56,000 sq ft) so the interactive plan and the space
# list can be built — they are NOT the real suite dimensions.
#
# `id` must match the id on the corresponding <path> in the floor-plan SVG. That
# string is the only join between the graphic and this data; if they drift, the
# plan silently stops highlighting and nothing errors. Worth a build-time check
# once the real SVG exists.
#
# Note there is no `available` field, by decision rather than omission: the client
# does not want up-to-the-day vacancy maintenance, and stale vacancy data is worse
# than none.

