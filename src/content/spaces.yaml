# Floor-plan units for "Find Your Space".
#
# ⚠️ SOURCE: Kil Architecture, "Proposed First Floor Plan", Ward Bakery
# Rehabilitation Phase I, dated 22 September 2021 — held in
# reference/floor-plans/. Three cautions:
#
#   1. It is marked PROPOSED and is four years old. These are almost certainly
#      not as-built dimensions, and some units are now occupied.
#   2. It covers the FIRST FLOOR ONLY. The basement (~18,976 sq ft gross) and
#      second floor (~4,642 sq ft gross) are not represented here at all.
#   3. The drawing carries Kil Architecture's title block with their address and
#      phone number. It must be cropped or redrawn before anything ships.
#
# Everything below is therefore `placeholder: true` until the client supplies a
# current plan. The numbers are real, but they describe a 2021 proposal.
#
# USF = usable square feet (what you occupy). RSF = rentable (what you're billed,
# including a share of common areas). Both are on the drawing and both matter —
# quoting one without saying which is how a first conversation goes wrong.
#
# `id` must match the id on the corresponding <path> in the floor-plan SVG once
# that exists. There is no `available` field, by decision: the client does not
# want up-to-the-day vacancy maintenance and stale vacancy data is worse than
# none.

